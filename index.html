<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چت زنده با Supabase</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .box {
      background: #1e293b;
      border-radius: 16px;
      padding: 18px;
    }
    h1 { text-align: center; color: #38bdf8; font-size: 1.4rem; margin-bottom: 12px; }
    input, button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      margin-top: 8px;
    }
    input {
      background: #0f172a;
      color: white;
    }
    button {
      background: #0ea5e9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.red { background: #dc2626; }

    #status {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      background: #334155;
      margin-bottom: 8px;
    }
    #status.ok { background: #15803d; }
    #status.wait { background: #b45309; }
    #status.err { background: #b91c1c; }

    #online {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      min-height: 20px;
    }

    #messages {
      height: 380px;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .msg {
      margin: 8px 0;
      padding: 9px 13px;
      border-radius: 12px;
      max-width: 85%;
      word-break: break-word;
      line-height: 1.4;
      font-size: 15px;
    }
    .msg.me { background: #0369a1; margin-right: auto; }
    .msg.other { background: #5b21b6; margin-left: auto; }
    .msg.sys {
      background: #334155;
      margin: 6px auto;
      font-size: 13px;
      text-align: center;
      color: #94a3b8;
      max-width: 90%;
    }
    .msg .name {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 3px;
    }

    .row { display: flex; gap: 8px; }
    .row input { flex: 1; margin: 0; }
    .row button { width: auto; min-width: 90px; margin: 0; }
  </style>
</head>
<body>
  <div class="container">

    <!-- فرم ورود -->
    <div class="box" id="loginBox">
      <h1>💬 چت زنده Supabase</h1>

      <input type="text" id="supabaseUrl" placeholder="Project URL (از تنظیمات Supabase)">
      <input type="text" id="supabaseKey" placeholder="anon public key">
      <input type="text" id="roomName" placeholder="نام اتاق (مثلاً dostan123)" value="dostan">
      <input type="text" id="username" placeholder="اسم خودت">

      <button id="btnConnect" onclick="connect()">ورود به چت</button>
    </div>

    <!-- بخش چت -->
    <div class="box" id="chatBox" style="display:none;">
      <div id="status">در حال اتصال...</div>
      <div id="online">آنلاین‌ها: -</div>

      <div id="messages"></div>

      <div class="row">
        <input type="text" id="msgInput" placeholder="پیامت را بنویس..." disabled
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="btnSend" onclick="sendMessage()" disabled>ارسال</button>
      </div>

      <button class="red" style="margin-top:10px;" onclick="disconnect()">خروج از اتاق</button>
    </div>

  </div>

  <script>
    // ================== تنظیمات ==================
    // این دو تا رو با اطلاعات پروژه‌ات عوض کن (یا از فرم وارد کن)
    let SUPABASE_URL = 'https://ihbsxjgzrhnssluqooqh.supabase.co';
    let SUPABASE_ANON_KEY = 'sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj';

    let supabase = null;
    let channel = null;
    let myUsername = '';
    let currentRoom = '';

    // ================== توابع کمکی ==================
    function setStatus(text, type = '') {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = type;
    }

    function addMessage(text, type = 'sys', name = '') {
      const div = document.createElement('div');
      div.className = 'msg ' + type;

      if (name && type !== 'sys') {
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = name;
        div.appendChild(nameEl);
      }

      const content = document.createElement('div');
      content.textContent = text;
      div.appendChild(content);

      const box = document.getElementById('messages');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function updateOnlineList(state) {
      const users = [];
      for (const key in state) {
        const presences = state[key];
        if (presences && presences.length > 0) {
          users.push(presences[0].username || key);
        }
      }
      document.getElementById('online').textContent = 
        users.length > 0 ? 'آنلاین‌ها: ' + users.join('، ') : 'آنلاین‌ها: کسی نیست';
    }

    // ================== اتصال ==================
    async function connect() {
      SUPABASE_URL = document.getElementById('supabaseUrl').value.trim();
      SUPABASE_ANON_KEY = document.getElementById('supabaseKey').value.trim();
      currentRoom = document.getElementById('roomName').value.trim();
      myUsername = document.getElementById('username').value.trim();

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        alert('آدرس و کلید Supabase را وارد کن');
        return;
      }
      if (!currentRoom || !myUsername) {
        alert('نام اتاق و اسم خودت را وارد کن');
        return;
      }

      document.getElementById('btnConnect').disabled = true;
      setStatus('در حال اتصال...', 'wait');

      // ساخت کلاینت
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // کانال اتاق
      channel = supabase.channel(`room:${currentRoom}`, {
        config: {
          presence: {
            key: myUsername, // هر کاربر با اسم خودش
          },
        },
      });

      // گوش دادن به پیام‌های Broadcast
      channel.on('broadcast', { event: 'message' }, (payload) => {
        const { username, text } = payload.payload;
        if (username === myUsername) return; // پیام خودم رو دوباره نشون نده
        addMessage(text, 'other', username);
      });

      // رویدادهای Presence (ورود و خروج)
      channel.on('presence', { event: 'sync' }, () => {
        const state = channel.presenceState();
        updateOnlineList(state);
      });

      channel.on('presence', { event: 'join' }, ({ key, newPresences }) => {
        const name = newPresences[0]?.username || key;
        if (name !== myUsername) {
          addMessage(`${name} وارد شد`, 'sys');
        }
      });

      channel.on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
        const name = leftPresences[0]?.username || key;
        addMessage(`${name} خارج شد`, 'sys');
      });

      // سابسکرایب
      channel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          // اعلام حضور
          await channel.track({
            username: myUsername,
            online_at: new Date().toISOString(),
          });

          // موفقیت
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('chatBox').style.display = 'block';
          document.getElementById('msgInput').disabled = false;
          document.getElementById('btnSend').disabled = false;

          setStatus(`متصل به اتاق «${currentRoom}»`, 'ok');
          addMessage(`شما با نام «${myUsername}» وارد شدید`, 'sys');
        } else if (status === 'CHANNEL_ERROR') {
          setStatus('خطا در اتصال به اتاق', 'err');
          document.getElementById('btnConnect').disabled = false;
        } else if (status === 'TIMED_OUT') {
          setStatus('اتصال تایم‌اوت شد', 'err');
          document.getElementById('btnConnect').disabled = false;
        }
      });
    }

    // ================== ارسال پیام ==================
    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !channel) return;

      // اول پیام خودم رو نشون بده
      addMessage(text, 'me', myUsername);

      // بعد برای بقیه بفرست
      await channel.send({
        type: 'broadcast',
        event: 'message',
        payload: {
          username: myUsername,
          text: text,
          time: new Date().toISOString()
        }
      });

      input.value = '';
    }

    // ================== قطع اتصال ==================
    async function disconnect() {
      if (channel) {
        await channel.untrack();
        await supabase.removeChannel(channel);
      }
      location.reload();
    }
  </script>
</body>
</html>
