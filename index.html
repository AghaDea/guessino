<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Guessino</title>
<script>
(function () {
  function baseDir() {
    var path = location.pathname || '/';
    if (/\/index\.html$/i.test(path)) path = path.replace(/\/index\.html$/i, '/');
    else if (!path.endsWith('/')) {
      if (/\.[a-zA-Z0-9]+$/.test(path.split('/').pop())) path = path.replace(/\/[^/]*$/, '/');
      else path = path + '/';
    }
    return path;
  }
  try {
    var b = baseDir();
    if (localStorage.getItem('gz_user_id')) location.replace(b + 'app/');
    else location.replace(b + 'login/');
  } catch (e) {
    try { location.replace('login/'); }
    catch (e2) { location.replace('/login/'); }
  }
})();
</script>
</head>
<body></body>
</html>
