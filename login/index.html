<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Guessino · Login</title>
<link rel="stylesheet" href="css/style.css">
<script>

(function(){
  var SUPABASE_URL = 'https://ihbsxjgzrhnssluqooqh.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj';
  function baseRoot() {
    var path = location.pathname || '/';
    if (/\/index\.html$/i.test(path)) path = path.replace(/\/index\.html$/i, '/');
    else if (!path.endsWith('/')) {
      if (/\.[a-zA-Z0-9]+$/.test(path.split('/').pop())) path = path.replace(/\/[^/]*$/, '/');
      else path = path + '/';
    }
    return path.replace(/\/(app|login|update)\/?$/i, '/');
  }
  window.__gzSiteUpdateActive = function(row) {
    if (!row || !row.enabled) return false;
    if (!row.ends_at) return true; // no date = on until disabled
    var end = Date.parse(row.ends_at);
    if (!isFinite(end)) return !!row.enabled;
    return end > Date.now();
  };
  window.__gzSiteUpdateFetch = function(cb) {
    var done = false;
    function finish(row) { if (done) return; done = true; try { cb(row || null); } catch (e) {} }
    var t = setTimeout(function(){ finish(null); }, 4500);
    function fromRest() {
      fetch(SUPABASE_URL + '/rest/v1/site_update?id=eq.1&select=enabled,ends_at,title,message&limit=1', {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Accept': 'application/json'
        }
      }).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
        clearTimeout(t);
        var row = rows && rows[0] ? rows[0] : null;
        // client-side clear if past (best-effort)
        if (row && row.enabled && row.ends_at) {
          var end = Date.parse(row.ends_at);
          if (isFinite(end) && end <= Date.now()) {
            row.enabled = false;
            row.ends_at = null;
            try {
              fetch(SUPABASE_URL + '/rest/v1/site_update?id=eq.1', {
                method: 'PATCH',
                headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                  'Content-Type': 'application/json',
                  'Prefer': 'return=minimal'
                },
                body: JSON.stringify({ enabled: false, ends_at: null, updated_at: new Date().toISOString() })
              }).catch(function(){});
            } catch (e) {}
          }
        }
        finish(row);
      }).catch(function(){ clearTimeout(t); finish(null); });
    }
    // prefer RPC normalize
    try {
      fetch(SUPABASE_URL + '/rest/v1/rpc/site_update_normalize', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: '{}'
      }).then(function(r){ return r.ok ? r.json() : null; }).then(function(data){
        if (data && data.ok) {
          clearTimeout(t);
          finish({
            enabled: !!data.enabled && !!data.active,
            ends_at: data.ends_at,
            title: data.title,
            message: data.message,
            _active: !!data.active
          });
        } else fromRest();
      }).catch(function(){ fromRest(); });
    } catch (e) { fromRest(); }
  };
  window.__gzGoUpdate = function() {
    try { location.replace(baseRoot() + 'update/'); }
    catch (e) { location.replace('/update/'); }
  };
})();

window.__gzSiteUpdateFetch(function(row){ if(window.__gzSiteUpdateActive(row)) window.__gzGoUpdate(); });
</script>
  <script src="../Config/load-config.js"></script>
</head>
<body>

<div id="app">
  <div id="loadingScreen" class="loading-wrap">
    <div class="spinner"></div>
    <div class="t">Loading…</div>
  </div>

  <div id="authScreen" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-logo">Guess<span>ino</span></div>
      <div class="auth-sub" id="authSub">Sign in to continue</div>
      <div id="authError" class="err-msg hidden"></div>
      <div class="field"><label>Username</label><input id="authUsername" maxlength="16" placeholder="2 to 16 characters" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="authPassword" type="password" maxlength="15" placeholder="3 to 15 characters" autocomplete="current-password"></div>
      <div style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true" tabindex="-1">
        <label for="authWebsite">Website</label>
        <input id="authWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="verify-wrap">
        <label>Drag the cut piece onto the checkered hole</label>
        <div class="puzzle-wrap" id="puzzleCaptcha">
          <div class="puzzle-head">
            <label>Security check</label>
            <button type="button" class="puzzle-refresh" id="puzzleRefreshBtn" title="New puzzle" aria-label="New puzzle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.1-5.7"/><polyline points="21 3 21 9 15 9"/></svg>
            </button>
          </div>
          <div class="puzzle-board" id="puzzleBoard">
            <canvas id="puzzleCanvas"></canvas>
            <div class="puzzle-target" id="puzzleTarget"></div>
            <div class="puzzle-piece" id="puzzlePiece"></div>
          </div>
          <div class="puzzle-hint">Drag the piece into the glowing slot</div>
          <div class="puzzle-status" id="puzzleStatus"></div>
        </div>
      </div>
      <button class="btn btn-primary" id="authSubmitBtn">Log In</button>
      <div class="switch-line" id="authSwitchLine">Don't have an account? <a href="#" id="authSwitchLink">Sign up</a></div>
    </div>
  </div>

  <div id="banScreen" class="ban-wrap hidden">
    <div class="ban-card">
      <div class="ban-icon">🚫</div>
      <h2>Account restricted</h2>
      <p id="banTypeText"></p>
      <p id="banReasonText"></p>
      <p id="banUntilText"></p>
      <button class="btn btn-ghost" id="banLogoutBtn">Back to Login</button>
    </div>
  </div>
</div>
  <script src="js/script.js"></script>
</body>
</html>
