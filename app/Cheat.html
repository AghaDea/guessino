<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Guessino</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#view{position:fixed;inset:0;z-index:1}
#view iframe{width:100%;height:100%;border:0;background:#000}
#gzh-orb{
  position:fixed;z-index:999999;width:52px;height:52px;border-radius:50%;
  left:14px;bottom:100px;cursor:grab;touch-action:none;user-select:none;
  background:radial-gradient(circle at 35% 30%,#5eb0ff,#1d6fd4 55%,#0a3a7a);
  box-shadow:0 6px 22px rgba(0,80,180,.45),inset 0 1px 0 rgba(255,255,255,.2);
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.15)
}
#gzh-orb.on{box-shadow:0 0 0 3px rgba(0,200,120,.4),0 6px 22px rgba(0,150,90,.35)}
#gzh-orb:active{cursor:grabbing}
#gzh-panel{
  position:fixed;z-index:1000000;width:258px;display:none;flex-direction:column;gap:7px;
  background:#12151a;border:1px solid #2a3038;border-radius:14px;padding:12px;
  box-shadow:0 16px 48px rgba(0,0,0,.55);font:12px/1.4 system-ui,-apple-system,sans-serif;color:#e8e8e8
}
#gzh-panel.open{display:flex}
#gzh-panel h3{font-size:11px;color:#8ab;margin:0 0 2px;letter-spacing:.04em;text-transform:uppercase}
#gzh-panel .r{display:flex;gap:6px}
#gzh-panel button{
  flex:1;border:1px solid #2a3038;background:#1a1f27;color:#eee;border-radius:8px;
  padding:8px 6px;font-weight:650;font-size:12px;cursor:pointer
}
#gzh-panel button.go{background:#1d6fd4;border-color:#2a7de0}
#gzh-panel button.st{background:#3a1518;border-color:#6a2a30;color:#f88}
#gzh-st{color:#8a9;font-size:11px;padding:2px 0}
#gzh-log{
  height:112px;overflow:auto;background:#0c0e12;border:1px solid #222830;border-radius:8px;
  padding:6px 8px;font:11px/1.45 ui-monospace,Menlo,monospace;color:#9bc
}
#gzh-log div{padding:2px 0;border-bottom:1px solid #181c22}
</style>
</head>
<body>
<div id="view"><iframe id="site" title="Guessino" src="index.html"></iframe></div>

<div id="gzh-orb" title="Helper">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</div>
<div id="gzh-panel">
  <h3>Auto helper</h3>
  <div class="r">
    <button type="button" class="go" id="gzh-start">Start</button>
    <button type="button" class="st" id="gzh-stop">Stop</button>
  </div>
  <div class="r">
    <button type="button" id="gzh-once">One guess</button>
    <button type="button" id="gzh-clr">Clear log</button>
  </div>
  <div id="gzh-st">Ready · use Game inside preview</div>
  <div id="gzh-log"></div>
</div>

<script>
(function(){
  var RANGES = {
    easy:[0,10000], normal:[10000,500000],
    hard:[500000,1000000], extreme:[1000000,5000000]
  };
  /* timing — aggressive */
  var POLL_MS = 45;
  var AFTER_GUESS_MS = 40;
  var AFTER_WIN_MS = 700;
  var NEXT_ROUND_MS = 350;

  var frame = document.getElementById('site');
  var orb = document.getElementById('gzh-orb');
  var pan = document.getElementById('gzh-panel');
  var S = {
    running:false, low:0, high:1e9, tried:Object.create(null),
    last:null, wins:0, busy:false, lastSeen:'',
    poll:null, obs:null, winWait:false
  };

  function log(t){
    var e = document.getElementById('gzh-log');
    var d = document.createElement('div');
    var n = new Date();
    var ts = [n.getHours(),n.getMinutes(),n.getSeconds()].map(function(x){return x<10?'0'+x:''+x}).join(':');
    d.textContent = ts + '  ' + t;
    e.appendChild(d);
    e.scrollTop = e.scrollHeight;
  }
  function status(t){ document.getElementById('gzh-st').textContent = t; }

  function doc(){
    try{ return frame.contentDocument || frame.contentWindow.document; }catch(e){ return null; }
  }
  function win(){
    try{ return frame.contentWindow; }catch(e){ return null; }
  }
  function q(sel){
    var d = doc();
    return d ? d.querySelector(sel) : null;
  }
  function mode(){
    var w = win();
    try{ if(w && w.gameMode && RANGES[w.gameMode]) return w.gameMode; }catch(e){}
    var b = q('#modeTabs button.active') || q('[data-mode].active');
    if(b && b.dataset && b.dataset.mode) return b.dataset.mode;
    return 'normal';
  }
  function reset(){
    var m = mode(), r = RANGES[m] || RANGES.normal;
    S.low = r[0]; S.high = r[1]; S.tried = Object.create(null); S.last = null;
    S.lastSeen = ''; S.winWait = false;
    log('reset ' + m + ' [' + S.low + '-' + S.high + ']');
  }
  function resText(){
    var el = q('#resultLabel') || q('.result-label');
    return el ? (el.textContent || '').trim() : '';
  }
  function inGame(){
    var main = q('#mainApp');
    if(main && !main.classList.contains('hidden')) return true;
    return !!(q('.keypad') || q('#keypad') || q('#guessDisplay'));
  }
  function typeNum(n){
    var w = win(), d = doc();
    if(!d) return false;
    try{
      if(w && typeof w.typedDigits !== 'undefined'){
        w.typedDigits = String(n);
        if(typeof w.renderTypedDigits === 'function') w.renderTypedDigits();
        if(typeof w.submitGuess === 'function'){ w.submitGuess(); return true; }
      }
    }catch(e){}
    var btns = d.querySelectorAll('.keypad button, #keypad button');
    var clr = null, set = null;
    btns.forEach(function(b){
      var t = (b.textContent || '').trim();
      if(t === 'Clear') clr = b;
      if(t === 'Set') set = b;
    });
    if(clr) clr.click();
    String(n).split('').forEach(function(ch){
      btns.forEach(function(b){ if((b.textContent||'').trim() === ch) b.click(); });
    });
    if(set){ set.click(); return true; }
    return false;
  }
  function pick(){
    var g = (S.low + S.high) >> 1, guard = 0;
    while(S.tried[g] && guard++ < 100){
      if(g < S.high) g++; else if(g > S.low) g--; else break;
    }
    if(S.tried[g]){
      for(var x = S.low; x <= S.high; x++) if(!S.tried[x]){ g = x; break; }
    }
    return g;
  }

  function applyFeedback(t){
    t = (t || '').toLowerCase();
    if(!t || S.last == null) return false;
    if(t === S.lastSeen) return false;

    if(t.indexOf('win') >= 0){
      S.lastSeen = t;
      S.wins++;
      log('WIN ' + S.last + ' #' + S.wins);
      status('Win — next');
      S.last = null;
      S.winWait = true;
      S.busy = false;
      setTimeout(function(){
        if(!S.running) return;
        reset();
        setTimeout(function(){
          S.winWait = false;
          if(S.running) fireGuess();
        }, NEXT_ROUND_MS);
      }, AFTER_WIN_MS);
      return true;
    }
    if(t.indexOf('higher') >= 0 || t.indexOf('↑') >= 0){
      S.lastSeen = t;
      S.low = S.last + 1;
      log('↑ higher → ' + S.low);
      S.busy = false;
      if(S.low > S.high) reset();
      queueMicrotask(function(){ if(S.running && !S.winWait) fireGuess(); });
      return true;
    }
    if(t.indexOf('lower') >= 0 || t.indexOf('↓') >= 0){
      S.lastSeen = t;
      S.high = S.last - 1;
      log('↓ lower → ' + S.high);
      S.busy = false;
      if(S.low > S.high) reset();
      queueMicrotask(function(){ if(S.running && !S.winWait) fireGuess(); });
      return true;
    }
    return false;
  }

  function fireGuess(){
    if(!S.running || S.busy || S.winWait) return;
    if(!doc() || !inGame()){ status('Waiting for game…'); return; }
    S.busy = true;
    S.lastSeen = '';
    var g = pick();
    S.tried[g] = 1;
    S.last = g;
    status('Guess ' + g + '  [' + S.low + '–' + S.high + ']');
    log('try ' + g);
    var ok = typeNum(g);
    if(!ok){
      log('keypad missing');
      S.busy = false;
      return;
    }
    /* poll result almost immediately */
    var tries = 0;
    var rapid = setInterval(function(){
      if(!S.running){ clearInterval(rapid); return; }
      var t = resText();
      if(applyFeedback(t)){ clearInterval(rapid); return; }
      if(++tries > 40){ clearInterval(rapid); S.busy = false; }
    }, AFTER_GUESS_MS);
  }

  function tick(){
    if(!S.running || S.busy || S.winWait) return;
    var t = resText();
    if(S.last != null && t && t !== S.lastSeen){
      if(applyFeedback(t)) return;
    }
    if(S.last == null && inGame()) fireGuess();
  }

  function bindObserver(){
    unbindObserver();
    var d = doc();
    if(!d) return;
    var el = d.querySelector('#resultLabel') || d.querySelector('.result-label');
    if(!el || typeof MutationObserver === 'undefined') return;
    S.obs = new MutationObserver(function(){
      if(!S.running || S.winWait) return;
      var t = resText();
      if(t && t !== S.lastSeen) applyFeedback(t);
    });
    try{
      S.obs.observe(el, { childList:true, characterData:true, subtree:true, attributes:true });
    }catch(e){}
  }
  function unbindObserver(){
    if(S.obs){ try{ S.obs.disconnect(); }catch(e){} S.obs = null; }
  }

  function start(){
    S.running = true; S.busy = false; S.winWait = false;
    orb.classList.add('on');
    reset();
    status('Auto ON (fast)');
    log('auto start fast');
    bindObserver();
    if(S.poll) clearInterval(S.poll);
    S.poll = setInterval(tick, POLL_MS);
    fireGuess();
  }
  function stop(){
    S.running = false; S.busy = false; S.winWait = false;
    orb.classList.remove('on');
    if(S.poll){ clearInterval(S.poll); S.poll = null; }
    unbindObserver();
    status('Stopped');
    log('auto stop');
  }

  /* drag */
  var drag = { on:0, ox:0, oy:0, moved:0 };
  function place(){
    var r = orb.getBoundingClientRect(), pw = 258, ph = pan.offsetHeight || 260;
    var x = r.left + r.width/2 - pw/2, y = r.top - ph - 8;
    if(y < 6) y = r.bottom + 8;
    x = Math.max(6, Math.min(innerWidth - pw - 6, x));
    pan.style.left = x + 'px';
    pan.style.top = y + 'px';
  }
  function down(e){
    var p = e.touches ? e.touches[0] : e;
    drag.on = 1; drag.moved = 0;
    drag.ox = p.clientX - orb.offsetLeft;
    drag.oy = p.clientY - orb.offsetTop;
    e.preventDefault();
  }
  function move(e){
    if(!drag.on) return;
    var p = e.touches ? e.touches[0] : e;
    var nx = p.clientX - drag.ox, ny = p.clientY - drag.oy;
    if(Math.abs(nx - orb.offsetLeft) > 3 || Math.abs(ny - orb.offsetTop) > 3) drag.moved = 1;
    orb.style.left = Math.max(0, Math.min(innerWidth - 52, nx)) + 'px';
    orb.style.top = Math.max(0, Math.min(innerHeight - 52, ny)) + 'px';
    orb.style.bottom = 'auto';
    if(pan.classList.contains('open')) place();
  }
  function up(){
    if(!drag.on) return;
    var m = drag.moved; drag.on = 0;
    if(!m){ pan.classList.toggle('open'); if(pan.classList.contains('open')) place(); }
  }
  orb.addEventListener('mousedown', down);
  orb.addEventListener('touchstart', down, {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', up);
  window.addEventListener('touchend', up);

  document.getElementById('gzh-start').onclick = start;
  document.getElementById('gzh-stop').onclick = stop;
  document.getElementById('gzh-once').onclick = function(){
    if(!S.running){ S.busy = false; S.winWait = false; if(S.last == null) reset(); fireGuess(); }
  };
  document.getElementById('gzh-clr').onclick = function(){ document.getElementById('gzh-log').innerHTML = ''; };

  frame.addEventListener('load', function(){
    status('Preview ready');
    log('preview loaded');
    if(S.running) bindObserver();
  });
})();
</script>
</body>
</html>
