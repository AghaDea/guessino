<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Update</title>
<style>
:root{--bg:#0a0a0a;--fg:#f0f0f0;--muted:#7a7a7a;--line:#1c1c1c;--accent:#2e2e2e}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;padding:1.5rem}
.card{max-width:360px;width:100%;text-align:center}
.spinner{width:40px;height:40px;margin:0 auto 1.5rem;border:2px solid var(--accent);border-top-color:var(--muted);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.1rem;font-weight:600;letter-spacing:-.025em;margin-bottom:.4rem}
p{color:var(--muted);font-size:.88rem;margin-bottom:1.5rem}
.progress{height:2px;background:var(--line);border-radius:1px;overflow:hidden;margin-bottom:1rem}
.bar{height:100%;width:100%;background:var(--muted);transform-origin:left;transition:transform 1s linear}
.meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.countdown{font-size:1.6rem;font-weight:600;letter-spacing:.06em;margin:0 0 1.25rem;font-variant-numeric:tabular-nums}
button{margin-top:1.5rem;background:transparent;border:1px solid var(--accent);color:var(--fg);padding:.5rem 1.15rem;border-radius:5px;font-size:.82rem;cursor:pointer}
button:hover{border-color:#444;background:#111}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="card">
  <div class="spinner" aria-hidden="true"></div>
  <h1 id="title">Temporarily unavailable</h1>
  <p id="msg">A quick update is in progress. The page will refresh automatically.</p>
  <div class="countdown" id="timer">00:00:00</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="meta"><span>Until end (server)</span><span id="syncLabel">sync…</span></div>
  <button type="button" id="retry">Try now</button>
</div>
<script>

(function(){
  var SUPABASE_URL = 'https://ihbsxjgzrhnssluqooqh.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj';
  function baseRoot() {
    var path = location.pathname || '/';
    if (/\/index\.html$/i.test(path)) path = path.replace(/\/index\.html$/i, '/');
    else if (!path.endsWith('/')) {
      if (/\.[a-zA-Z0-9]+$/.test(path.split('/').pop())) path = path.replace(/\/[^/]*$/, '/');
      else path = path + '/';
    }
    return path.replace(/\/(app|login|update)\/?$/i, '/');
  }
  window.__gzSiteUpdateFetch = function(cb) {
    var done = false;
    function finish(row) { if (done) return; done = true; try { cb(row || null); } catch (e) {} }
    var t = setTimeout(function(){ finish(null); }, 4000);
    try {
      fetch(SUPABASE_URL + '/rest/v1/site_update?id=eq.1&select=enabled,ends_at,title,message&limit=1', {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Accept': 'application/json'
        }
      }).then(function(r){ return r.ok ? r.json() : []; }).then(function(rows){
        clearTimeout(t);
        finish(rows && rows[0] ? rows[0] : null);
      }).catch(function(){ clearTimeout(t); finish(null); });
    } catch (e) { clearTimeout(t); finish(null); }
  };
  window.__gzSiteUpdateActive = function(row) {
    if (!row || !row.enabled) return false;
    if (!row.ends_at) return false;
    var end = Date.parse(row.ends_at);
    if (!isFinite(end)) return false;
    return end > Date.now();
  };
  window.__gzGoUpdate = function() {
    try { location.replace(baseRoot() + 'update/'); }
    catch (e) { location.replace('/update/'); }
  };
})();

(function(){
  var titleEl=document.getElementById('title');
  var msgEl=document.getElementById('msg');
  var timerEl=document.getElementById('timer');
  var bar=document.getElementById('bar');
  var syncLabel=document.getElementById('syncLabel');
  var retry=document.getElementById('retry');
  var endsAt=0;
  var totalSpan=0;
  var tickId=null;

  function pad(n){ n=Math.max(0,n|0); return n<10?'0'+n:''+n; }
  function fmt(ms){
    if(ms<0) ms=0;
    var s=Math.floor(ms/1000);
    var h=Math.floor(s/3600); s%=3600;
    var m=Math.floor(s/60); s%=60;
    return pad(h)+':'+pad(m)+':'+pad(s);
  }
  function baseDir(){
    var path=location.pathname||'/';
    if(/\/index\.html$/i.test(path)) path=path.replace(/\/index\.html$/i,'/');
    else if(!path.endsWith('/')){
      if(/\.[a-zA-Z0-9]+$/.test(path.split('/').pop())) path=path.replace(/\/[^/]*$/,'/');
      else path=path+'/';
    }
    return path.replace(/\/update\/?$/i,'/');
  }
  function leave(){
    try{
      if(localStorage.getItem('gz_user_id')) location.replace(baseDir()+'app/');
      else location.replace(baseDir()+'login/');
    }catch(e){ location.replace(baseDir()+'login/'); }
  }
  function paint(){
    var left=endsAt-Date.now();
    timerEl.textContent=fmt(left);
    if(totalSpan>0){
      var r=Math.max(0,Math.min(1,left/totalSpan));
      bar.style.transform='scaleX('+r+')';
    }else bar.style.transform='scaleX(0)';
    if(left<=0 && endsAt>0){
      // ended locally — recheck server
      syncFromServer();
    }
  }
  function syncFromServer(){
    syncLabel.textContent='sync…';
    window.__gzSiteUpdateFetch(function(row){
      syncLabel.textContent='ok';
      if(!window.__gzSiteUpdateActive(row)){ leave(); return; }
      if(row.title) titleEl.textContent=row.title;
      if(row.message) msgEl.textContent=row.message;
      var end=Date.parse(row.ends_at);
      if(!isFinite(end)){ leave(); return; }
      endsAt=end;
      var span=endsAt-Date.now();
      if(span>0) totalSpan=Math.max(totalSpan, span);
      if(!totalSpan) totalSpan=span||1;
      paint();
    });
  }
  if(tickId) clearInterval(tickId);
  tickId=setInterval(paint,1000);
  setInterval(syncFromServer,15000);
  retry.addEventListener('click',syncFromServer);
  syncFromServer();
})();
</script>
</body>
</html>
